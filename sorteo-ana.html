<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorteo de Instagram</title>
  <style>
    :root {
      --ig-gradient: linear-gradient(45deg, #405DE6, #5851DB, #833AB4, #C13584, #E1306C, #FD1D1D, #F56040, #F77737, #FCAF45, #FFDC80);
      --ig-pink: #e1306c;
      --ig-blue: #0095f6;
      --ig-blue-hover: #1877f2;
      --bg: #fafafa;
      --card: #ffffff;
      --text: #262626;
      --muted: #8e8e8e;
      --border: #dbdbdb;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      background: var(--card);
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      text-align: center;
      width: 100%;
      max-width: 500px;
      border-top: 4px solid transparent;
      border-image: var(--ig-gradient) 1;
    }

    h1 {
      font-size: 26px;
      margin-top: 0;
      margin-bottom: 8px;
      background: var(--ig-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    label {
      display: block;
      text-align: left;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    input[type="url"] {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="url"]:focus {
      outline: none;
      border-color: var(--ig-pink);
      box-shadow: 0 0 0 3px rgba(225, 48, 108, 0.15);
    }

    button {
      width: 100%;
      background: var(--ig-blue);
      color: white;
      border: none;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 20px;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:hover { background: var(--ig-blue-hover); }
    button:active { transform: scale(0.98); }

    /* ====== Segunda sección (placeholder) ====== */
    #step-2 {
      display: none;
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    .placeholder-card {
      background: var(--card);
      padding: 50px 30px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      border-top: 4px solid transparent;
      border-image: var(--ig-gradient) 1;
    }

    .placeholder-card h2 {
      margin-top: 0;
      color: var(--text);
    }

    .placeholder-card .link-preview {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 14px;
      background: #fff0f5;
      color: var(--ig-pink);
      font-size: 13px;
      border-radius: 8px;
      word-break: break-all;
      border-left: 3px solid var(--ig-pink);
    }

    .placeholder-card .info {
      margin-top: 24px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .back-btn {
      background: var(--border);
      color: var(--text);
      width: auto;
      padding: 10px 20px;
      font-size: 14px;
      margin-top: 24px;
    }
    .back-btn:hover { background: #c7c7c7; }
  </style>
</head>
<body>

  <!-- ============ PASO 1: Enlace de la publicación ============ -->
  <div class="container" id="step-1">
    <h1>Sorteo de Instagram</h1>
    <p class="subtitle">Pega el enlace de la publicación del sorteo para comenzar.</p>

    <label for="ig-post">Enlace de la publicación</label>
    <input
      type="url"
      id="ig-post"
      placeholder="https://www.instagram.com/p/XXXXXXXXX/"
      autofocus
    >

    <button onclick="goToStep2()">Continuar →</button>
  </div>

  <!-- ============ PASO 2: Placeholder (próximamente) ============ -->
  <div id="step-2">
    <div class="placeholder-card">
      <h2>🎯 Publicación seleccionada</h2>
      <p>Este es el enlace que se usará para el sorteo:</p>
      <span class="link-preview" id="post-preview"></span>

      <p class="info">
        Aquí desarrollaremos la siguiente sección:<br>
        carga de participantes, sorteo y resultados.
      </p>

      <button class="back-btn" onclick="goBack()">← Volver</button>
    </div>
  </div>

  <script>
    const igInput = document.getElementById('ig-post');

    function goToStep2() {
      const url = igInput.value.trim();

      // Validación simple
      if (!url) {
        alert("Por favor, pega el enlace de la publicación de Instagram.");
        return;
      }
      if (!url.includes('instagram.com')) {
        alert("El enlace no parece ser de Instagram. Verifícalo, por favor.");
        return;
      }

      // Guardamos el enlace para usarlo más adelante
      sessionStorage.setItem('igPostUrl', url);

      // Mostramos el enlace en la segunda pantalla
      document.getElementById('post-preview').innerText = url;

      // Cambiamos de pantalla
      document.getElementById('step-1').style.display = 'none';
      document.getElementById('step-2').style.display = 'block';
    }

    function goBack() {
      document.getElementById('step-2').style.display = 'none';
      document.getElementById('step-1').style.display = 'block';
    }

    // Permitir "Enter" en el input para pasar al paso 2
    igInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        goToStep2();
      }
    });
  </script>
</body>
</html>
